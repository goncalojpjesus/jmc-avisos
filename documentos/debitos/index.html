<!DOCTYPE html>

<style>

 --ok:#34a26a;--okb:#e5f4ea;--fat:#d9a514;--fatb:#fdf3d3;--ko:#d2513f;--kob:#fbe5e1;--pend:#c9c4b8}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:400 14px/1.45 Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}

.sp{flex:1}

<script>
const $=id=>document.getElementById(id);
const MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const eur=v=>(Math.round((v||0)*100)/100).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\s/g,' ')+' €';
const eur0=v=>Math.round(v||0).toLocaleString('pt-PT').replace(/\s/g,' ')+' €';
const hojeM=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const addM=(m,k)=>{let [y,mm]=m.split('-').map(Number);mm+=k;while(mm>12){mm-=12;y++;}while(mm<1){mm+=12;y--;}return y+'-'+String(mm).padStart(2,'0');};
const mLab=m=>{const [y,mm]=m.split('-');return MN[+mm-1]+' '+y;};
const mCurto=m=>{const [y,mm]=m.split('-');return MN[+mm-1].slice(0,3)+' '+y.slice(2);};

/* ===== ligação ao servidor: carregar e guardar ===== */
let S={v:0},LAST='',SAVING=false,PEND=false,PRONTO=false;
function jmcNome(){try{return localStorage.getItem('jmc_dd_nome')||''}catch(e){return ''}}
function estadoAtual(){const verif=Object.assign({},S.verif||{});if(VERIF)verif[AL]=VERIF;else delete verif[AL];const ret=Object.assign({},S.ret||{});ret[AL]=RET;
 return {contratos:C,novos:NOVOS,verif,ret,envios:S.envios||{},arquivados:S.arquivados||[]}}
function agendaGuardar(){if(!PRONTO)return;clearTimeout(window.__gT);window.__gT=setTimeout(guardar,500)}
async function guardar(){if(SAVING){PEND=true;return}const d=estadoAtual(),js=JSON.stringify(d);if(js===LAST)return;SAVING=true;sync('A guardar…');
 try{const r=await jmcApi('ddGuardar',{v:S.v,data:d});S.v=r.v;LAST=js;sync('Guardado ✓')}
 catch(e){sync('Não guardado');if(/outra pessoa|versão/i.test(e.message||'')){alert(e.message+'\nA página vai recarregar com os dados mais recentes.');await carregar()}else alert('Não foi possível guardar: '+(e.message||e))}
 finally{SAVING=false;if(PEND){PEND=false;guardar()}}}
function sync(t){const e=$('syncInfo');if(e){e.textContent=t;e.style.opacity=1;clearTimeout(e._t);if(/✓/.test(t))e._t=setTimeout(()=>e.style.opacity=.55,1500)}}
async function carregar(){PRONTO=false;sync('A carregar…');const r=await jmcApi('ddLer',{});S=r;C=r.data.contratos||[];NOVOS=r.data.novos||[];
 S.verif=r.data.verif||{};S.ret=r.data.ret||{};S.envios=r.data.envios||{};S.arquivados=r.data.arquivados||[];
 VERIF=S.verif[AL]||null;RET=S.ret[AL]||{};LAST=JSON.stringify(estadoAtual());PRONTO=true;draw();sync('Atualizado ✓');if(!C.length)importarInicial()}
function importarInicial(){const w=document.querySelector('.wrap');if($('impC'))return;w.insertAdjacentHTML('afterbegin',`<div class="card" id="impC" style="margin-bottom:18px"><h2>Importar dados iniciais</h2><p class="hint">Só uma vez: escolha o ficheiro <b>jmc-debitos-inicial.json</b> (nas Transferências). Só a supervisão (Dr. Gonçalo / Dra. Catarina) pode importar. Os contratos novos que já estão à espera de confirmação mantêm-se.</p><input type="file" id="impF" accept=".json" style="margin-top:10px"></div>`);
 $('impF').onchange=async()=>{const f=$('impF').files[0];if(!f)return;try{const d=JSON.parse(await f.text());delete d.v;const r=await jmcApi('ddImportar',{data:d});toast(r.n+' contratos importados.');$('impC').remove();await carregar()}catch(e){alert('Não foi possível importar: '+(e.message||e))}}}
let MES=hojeM(), UN='', TAB='mes', FE='at', FM='at', CUR=null;
/* contratos (importados do Excel). A unidade dos antigos fica "por confirmar" até alguém a indicar. */
let C=[];
const nrm=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toLowerCase();

/* exemplo: contratos novos que chegam do gerador de contratos e esperam confirmação */
let NOVOS=[];
const ST={'':{t:'Por lançar',c:'p'},fat:{t:'Saiu',c:'fat'},ok:{t:'Faturado',c:'ok'},falta:{t:'Falhou',c:'ko'}};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function info(c){const tot=c.deb.reduce((a,d)=>a+d.v,0),pago=c.deb.filter(d=>d.s==='ok'||d.s==='fat').reduce((a,d)=>a+d.v,0)+c.pag.reduce((a,p)=>a+p.v,0);
 const falh=c.deb.filter(d=>d.s==='falta'),atras=c.deb.filter(d=>d.s===''&&d.m<hojeM()),fut=c.deb.filter(d=>d.s===''&&d.m>=hojeM());
 const fim=!fut.length&&!falh.length&&!atras.length; const prox=fut[0];
 return {tot:tot+c.pag.reduce((a,p)=>a+p.v,0),pago,falta:Math.max(0,c.deb.filter(d=>d.s===''||d.s==='falta').reduce((a,d)=>a+d.v,0)),falh,atras,fut,fim,prox,n:c.deb.length,feitas:c.deb.filter(d=>d.s==='ok'||d.s==='fat').length};}
const okU=c=>!UN||c.uni===UN;
const refN=r=>{const m=String(r).match(/(\d+)(?:\s*(\d+))?\s*\/\s*(\d{4})/);return m?(+m[3])*1e5+(+m[1])*10+(+(m[2]||0)):0;};
const uniTag=u=>u==='A'?'<span class="uni A">Aveiro</span>':u==='F'?'<span class="uni F">Faíscas</span>':'<span class="uni q" title="Indicar a unidade no contrato">Unidade?</span>';
function draw(){ agendaGuardar(); drawLotes();
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===TAB));
 ['mes','ct','mapa'].forEach(v=>$('v-'+v).hidden=v!==TAB);
 drawNovos(); if(TAB==='mes')drawMes(); if(TAB==='ct')drawCt(); if(TAB==='mapa')drawMapa(); }

/* plano do contrato: entrada (partes por débito direto) + prestações. Contratos antigos sem marcação: a entrada são os primeiros valores diferentes da prestação. */
function planoGrupos(pl){pl=pl||[];if(!pl.length)return [];let fl;if(pl.some(x=>x.e))fl=pl.map(x=>!!x.e);else{const ref=pl.length>1?pl[pl.length-2].v:pl[0].v;let k=0;while(k<pl.length-1&&Math.abs(pl[k].v-ref)>0.011)k++;fl=pl.map((x,i)=>i<k)}
 const G=[];pl.forEach((x,i)=>{const m=String(x.d).slice(0,7),g=G[G.length-1];if(g&&g.e===fl[i]){g.n++;g.ate=m;g.tot+=x.v;g.vs.push(x.v)}else G.push({e:fl[i],n:1,de:m,ate:m,tot:x.v,vs:[x.v]})});
 G.forEach(g=>{g.v=g.vs[0];g.tot=Math.round(g.tot*100)/100});return G}
const mesesTxt=g=>g.de===g.ate?mLab(g.de):mCurto(g.de)+' – '+mCurto(g.ate);
function resumoPlano(n){const G=planoGrupos(n.plano);if(!G.length)return n.n+' × '+eur(n.men);return G.map(g=>(g.e?'entrada ':'')+g.n+' × '+eur(g.v)).join(' + ')}
function drawNovos(){ const el=$('novos'); if(!NOVOS.length){el.hidden=true;return;} el.hidden=false;
 el.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><h2 style="margin:0">Novos contratos a confirmar</h2><span class="badge">${NOVOS.length}</span></div><p class="hint" style="margin-bottom:8px">Gerados na app dos contratos. Os débitos só começam depois de confirmares que o contrato foi assinado.</p>`+

 <div class="sch">${c.deb.map((d,i)=>`<div class="r ${d.m<hojeM()?'past':''}"><span class="n">${i+1}.ª</span><span>${mLab(d.m)}</span><input class="amt" value="${d.v.toFixed(2).replace('.',',')}" onchange="setV('${c.id}',${i},this.value)"><span>${segStMini(c.id,i,d.s)}</span></div>`).join('')}</div>`;

let PAGO='manter';
function abrePag(id){ const c=C.find(x=>x.id===id), k=info(c); if(!k.fut.length) return toast('Este contrato já não tem prestações por lançar.'); $('pagH').textContent=c.nome+' · faltam '+k.fut.length+' prestações ('+eur(k.fut.reduce((a,d)=>a+d.v,0))+')';
 $('pV').value=''; $('pD').valueAsDate=new Date(); $('mPag').dataset.id=id; prevPag(); $('mPag').classList.add('on'); }
$('pO').onclick=e=>{ const l=e.target.closest('label'); if(!l) return; PAGO=l.dataset.o; [...$('pO').children].forEach(x=>x.classList.toggle('on',x===l)); prevPag(); };
function plano(c,E,o){ const fut=c.deb.map((d,i)=>({d,i})).filter(x=>x.d.s===''&&x.d.m>=hojeM()); const S=fut.reduce((a,x)=>a+x.d.v,0); E=Math.min(E,S);
 const novo=c.deb.map(d=>({...d})); let rem=[];
 if(o==='manter'){ const n=fut.length, base=Math.floor((S-E)/n*100)/100; let acc=0; fut.forEach((x,j)=>{ const v=j<n-1?base:Math.round((S-E-acc)*100)/100; acc+=v; novo[x.i].v=v; }); }
 else { let r=E; for(let j=fut.length-1;j>=0&&r>0.004;j--){ const x=fut[j]; if(novo[x.i].v<=r+0.004){ r-=novo[x.i].v; rem.push(x.i); } else { novo[x.i].v=Math.round((novo[x.i].v-r)*100)/100; r=0; } } }
 return {novo:novo.filter((d,i)=>!rem.includes(i)),fut,rem:rem.length,E}; }
function prevPag(){ const c=C.find(x=>x.id===$('mPag').dataset.id); if(!c) return; const E=parseFloat($('pV').value)||0; if(E<=0){ $('pP').innerHTML='Indica o valor pago.'; return; }
 const p=plano(c,E,PAGO), fut=p.novo.filter(d=>d.s===''&&d.m>=hojeM());
 $('pP').innerHTML=PAGO==='manter'?`Passa a pagar <b>${fut.length} × ${eur(fut[0]?fut[0].v:0)}</b>${fut.length>1&&fut[fut.length-1].v!==fut[0].v?' (última: '+eur(fut[fut.length-1].v)+')':''} · termina em ${fut.length?mLab(fut[fut.length-1].m):'—'}.`
  :`Mantém <b>${eur(fut[0]?fut[0].v:0)}</b>/mês · saem <b>${p.rem}</b> prestação(ões) no fim · passa a terminar em ${fut.length?mLab(fut[fut.length-1].m):'—'}${fut.length&&fut[fut.length-1].v!==fut[0].v?' (última: '+eur(fut[fut.length-1].v)+')':''}.`; }
function aplicaPag(){ const c=C.find(x=>x.id===$('mPag').dataset.id); const E=parseFloat($('pV').value)||0; if(E<=0) return toast('Indica o valor.');
 const p=plano(c,E,PAGO); if(p.E<=0) return toast('Não há prestações por lançar.'); c.deb=p.novo; c.pag.push({v:p.E,d:$('pD').value||new Date().toISOString().slice(0,10),o:PAGO}); $('mPag').classList.remove('on'); abreC(c.id,true); draw(); toast('Pagamento de '+eur(p.E)+' registado'); }
function alteraMen(id){ const c=C.find(x=>x.id===id), k=info(c); if(!k.fut.length) return toast('Não há prestações por lançar.');
 const S=k.fut.reduce((a,d)=>a+d.v,0); const n=parseInt(prompt('Faltam '+k.fut.length+' prestações ('+eur(S)+'). Em quantas prestações fica?',k.fut.length),10); if(!n||n<1) return;
 const fi=c.deb.findIndex(d=>d===k.fut[0]); const keep=c.deb.slice(0,fi).concat(c.deb.slice(fi).filter(d=>d.s!==''));
 const base=Math.floor(S/n*100)/100; let acc=0; const novos=[]; for(let j=0;j<n;j++){ const v=j<n-1?base:Math.round((S-acc)*100)/100; acc+=v; novos.push({m:addM(k.fut[0].m,j),v,s:''}); }
 c.deb=keep.concat(novos).sort((a,b)=>a.m<b.m?-1:1); abreC(id,true); draw(); toast('Plano refeito: '+n+' × '+eur(base)); }

function abreConf(id){ const n=NOVOS.find(x=>x.id===id); const ass=new Date(); const iso=n.adc&&/^\d{8}$/.test(n.adc)?n.adc.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3'):ass.toISOString().slice(0,10);

 <div class="doc">Lido no contrato gerado: ${n.docTxt}<br><span class="mini">Unidade detetada: <b>${n.uniDoc==='F'?'Faíscas':'Aveiro'}</b> — confirma abaixo.</span></div>
 <label class="f">Unidade onde foi assinado<select id="cU"><option value="A" ${n.uniDoc==='A'?'selected':''}>Aveiro</option><option value="F" ${n.uniDoc==='F'?'selected':''}>Faíscas</option></select></label>

 $('mConf').classList.add('on'); prevConf(id); }
function chkClinica(n){const it=[];if(+n.entClin>0)it.push('entrada inicial de <b>'+eur(n.entClin)+'</b>');if(+n.adm>0)it.push('consulta do contrato (<b>'+eur(n.adm)+'</b>)');

 if(n.entClin===undefined&&n.adm===undefined)return `<label class="chk"><input type="checkbox" id="k3"> <span><b>Pagamentos feitos na clínica na assinatura</b> (entrada inicial / consulta), se o contrato os previa. <span class="mini">Contrato gerado antes desta informação ser guardada.</span></span></label>`;

function primeiroMes(iso,dia){ const d=new Date(iso); let m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); return addM(m,1); }
function usaPlano(n,F,N,dia){const pl=n.plano||[];return pl.length===N&&Math.abs(pl.reduce((a,x)=>a+x.v,0)-F)<0.01&&dia===n.dia}

  $('cP').innerHTML=`<div class="plano">${G.map(g=>`<div class="${g.e?'e':''}"><span><b>${g.e?'Entrada (restante)':'Prestações'}</b> · ${g.n} × ${eur(g.v)}${g.vs.some(v=>Math.abs(v-g.v)>0.004)?' <span class="mini">(com acerto de cêntimos)</span>':''}</span><span>${mesesTxt(g)}</span></div>`).join('')}</div>
  1.º débito a <b>${dia} de ${mLab(m1)}</b> · lido do contrato (Anexo II). <span class="mini">(+1 € por débito, como diz o contrato)</span>`+
  (tarde.length?`<div class="xtra" style="margin-top:8px">O ficheiro de ${mLab(LA).split(' ')[0]} já foi gerado: ${tarde.length>1?'os débitos de '+tarde.map(x=>mLab(String(x.d).slice(0,7)).split(' ')[0]).join(', ')+' vão':'o débito de '+mLab(String(tarde[0].d).slice(0,7)).split(' ')[0]+' vai'} num <b>ficheiro extra</b>, que se gera no quadro de ${mLab(LA).split(' ')[0]} depois de confirmar.</div>`:'');return}
 $('cP').innerHTML=`1.º débito a <b>${dia} de ${mLab(m0)}</b> · ${N} × <b>${eur(Math.floor(F/N*100)/100)}</b> · último em ${mLab(addM(m0,N-1))}. <span class="mini">(+1 € por débito, como diz o contrato)</span>`; }
function confirma(id){ if(!$('k1').checked) return toast('Confirma primeiro que o contrato foi assinado.'); if(!$('k2').checked) return toast('Falta a autorização de débito direto.'); if($('k3')&&$('k3').dataset.req&&!$('k3').checked) return toast('Confirma o que foi pago na clínica na assinatura.');
 const n=NOVOS.find(x=>x.id===id); const F=parseFloat($('cF').value)||0, N=parseInt($('cN').value)||1, dia=parseInt($('cDia').value)||10, m0=primeiroMes($('cD').value,dia);

function lotesDe(mes){const by={};C.forEach(c=>c.deb.forEach((d,i)=>{if(d.m===mes&&d.v>0){(by[c.dia]=by[c.dia]||[]).push({c,d,i})}}));
 const [y,m]=mes.split('-').map(Number);const R=['I','II','III','IV','V'];const MS=DDSEPA.MESES;const amanha=new Date();amanha.setHours(0,0,0,0);amanha.setDate(amanha.getDate()+1);
 return Object.keys(by).map(Number).sort((a,b)=>a-b).map((dia,k)=>{let dt=DDSEPA.diaUtil(y,m-1,dia),atr=false;if(mes===AL&&dt<amanha){atr=true;dt=DDSEPA.diaUtil(amanha.getFullYear(),amanha.getMonth(),amanha.getDate())}
  const all=by[dia].map(x=>Object.assign(x,{inf:infoDe(x.c)})).sort((a,b)=>a.c.nome.localeCompare(b.c.nome));
  const L=all.filter(x=>!x.d.pd&&!x.d.s&&x.c.meio!=='transferencia'&&!RET[x.c.id+'|'+x.i]);
  return {dia,dt,atr,lote:MS[m-1]+' '+R[k],fich:'DD'+MS[m-1]+'_'+R[k]+'_'+y+'.xls',all,L,tot:L.reduce((a,x)=>a+x.d.v,0),falta:L.filter(x=>!x.inf)}})}
function lotesDoMes(){return lotesDe(AL)}

function infoDe(c){return c.iban?{aut:c.aut,iban:c.iban,dev:c.devedor||c.nome,adc:c.adc}:null}

function ddBancoMostra(){const out=$('bnR');let h='';
 for(const [k,B] of BANCO.entries()){const tot=B.L.reduce((a,x)=>a+(x.l.v||0),0),totM=+String(B.R.meta['montante']||'').replace(/\./g,'').replace(',','.');
  const cob=B.L.filter(x=>x.novo==='fat'),rej=B.L.filter(x=>x.novo==='falta'),sem=B.L.filter(x=>!x.c),dif=B.L.filter(x=>x.c&&!x.bate);
  h+=`<div class="card" style="padding:12px;margin-bottom:10px"><b>${esc(B.lote)}</b> <span class="mini">${esc(B.f.name)} · débitos de ${mLab(B.mes)} · ${B.L.length} linhas · ${eur(tot)}${totM&&Math.abs(totM-tot)>0.01?` <span style="color:var(--ko)">(o banco indica ${eur(totM)} — a leitura não bate certo)</span>`:totM?' ✓ igual ao total do banco':''}</span>
  <p style="margin:8px 0">${cob.length} cobrados → <b>Saiu</b> (para faturar) · ${rej.length} rejeitados → <b style="color:var(--ko)">Falhou</b> (contactar)${sem.length?` · <span style="color:var(--ko)">${sem.length} sem contrato</span>`:''}${dif.length?` · <span style="color:#a06a00">${dif.length} com valor diferente</span>`:''}</p>
  <table class="tb" style="width:100%;font-size:12.5px">${B.L.map((x,j)=>`<tr style="${x.novo==='falta'?'background:#fbefec':''}"><td><input type="checkbox" ${x.ok?'checked':''} ${x.c&&x.its.length?'':'disabled'} onchange="BANCO[${k}].L[${j}].ok=this.checked"></td><td>${esc(x.l.ref)}</td><td>${x.c?esc(x.c.nome):'<span style="color:var(--ko)">contrato não encontrado</span>'}</td><td class="num">${eur(x.l.v)}</td><td class="mini">${x.c?(x.bate?'':'no painel: '+eur(x.soma)):''}</td><td>${x.novo==='fat'?'Cobrado':x.novo==='falta'?'<b style="color:var(--ko)">'+esc(x.l.estado)+'</b> <span class="mini">'+esc(x.l.desc)+'</span>':esc(x.l.estado)}</td></tr>`).join('')}</table>
  ${!B.L.length?ddDevolSugere(B):''}</div>`}
 const faltam=ddFaltamNoBanco();if(faltam.length)h+=`<div class="warn" style="display:block">⚠︎ <b>${faltam.length} débito(s) de ${mLab(BANCO[0].mes)} não aparecem nos ficheiros lidos:</b> ${faltam.map(x=>esc(x.c.nome)+' ('+eur(x.d.v)+')').join(', ')}. Confirme se pagaram na clínica; se não, é preciso contactar.</div>`;
 h+=`<div style="text-align:right;margin-top:12px"><button class="btn g" onclick="ddBancoAplica()">Aplicar e guardar o PDF</button></div>`;out.innerHTML=h}
function ddFaltamNoBanco(){if(!BANCO||!BANCO.length)return[];const mes=BANCO[0].mes;const vis=new Set();BANCO.filter(B=>B.mes===mes).forEach(B=>B.L.forEach(x=>x.c&&vis.add(x.c.id)));
 const out=[];C.forEach(c=>{if(vis.has(c.id)||!c.iban)return;ddNoLote(c,mes).forEach(({d,i})=>{if(!d.s&&!d.banco)out.push({c,d,i})})});return out}
/* devoluções sem referência por linha: procura que débitos «Saiu» somam o valor devolvido */
function ddDevolSugere(B){const vals=[...new Set(B.R.valores)].filter(v=>v>0);if(!vals.length)return'<p class="mini">Não encontrei valores neste ficheiro.</p>';
 const pool=[];C.forEach(c=>{const g={};c.deb.forEach((d,i)=>{if(d.s==='fat'&&(d.m===B.mes||d.m===addM(B.mes,-1))){const k=d.m;(g[k]=g[k]||{c,m:k,v:0,its:[]});g[k].v=Math.round((g[k].v+d.v)*100)/100;g[k].its.push(i)}});Object.values(g).forEach(x=>pool.push(x))});
 B.sug=[];let h='<div class="k" style="margin-top:8px">Devoluções: combinações possíveis</div>';
 for(const v of vals.slice(0,6)){const sols=[];const n=pool.length;const rec=(st,acc,sum)=>{if(sols.length>=4)return;if(Math.abs(sum-v)<0.01){sols.push(acc.slice());return}if(sum>v+0.01)return;for(let j=st;j<n&&acc.length<6;j++){acc.push(pool[j]);rec(j+1,acc,Math.round((sum+pool[j].v)*100)/100);acc.pop()}};rec(0,[],0);
  h+=`<p style="margin:6px 0"><b>${eur(v)}</b>: ${sols.length?sols.map(s=>{const id=B.sug.push(s)-1;return `<label style="display:block"><input type="checkbox" onchange="BANCO.find(b=>b===BANCO[${BANCO.indexOf(B)}]).sug[${id}].ok=this.checked"> ${s.map(x=>esc(x.c.nome)+' '+eur(x.v)).join(' + ')}</label>`}).join(''):'<span class="mini">nenhuma combinação de débitos cobrados dá este valor</span>'}</p>`}
 return h+'<p class="mini">Marque a combinação certa: esses débitos passam a «Falhou».</p>'}
async function ddBancoAplica(){if(!BANCO)return;let n=0,f=0;
 for(const B of BANCO){for(const x of B.L){if(!x.ok)continue;x.its.forEach(({d})=>{if(d.s!==x.novo){aplicaLA(d,x.novo,'Banco: '+x.l.estado+(x.l.desc?' — '+x.l.desc:'')+' ('+B.lote+')');n++;if(x.novo==='falta')f++}d.banco={lote:B.lote,estado:x.l.estado,desc:x.l.desc,em:HOJE_ISO}})}
  (B.sug||[]).filter(s=>s.ok).forEach(s=>s.forEach(g=>g.its.forEach(i=>{const d=g.c.deb[i];aplicaLA(d,'falta','Banco: devolvido ('+B.f.name+')');d.banco={lote:B.lote,estado:'DEVOLVIDA',em:HOJE_ISO};n++;f++})))}
 draw();$('bnR').innerHTML='<p class="mini">A guardar os PDFs…</p>';
 for(const B of BANCO){try{const b64=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.readAsDataURL(new Blob([B.buf],{type:'application/pdf'}))});
  await jmcApi('ddBancoGuardar',{tipo:B.tipo,mes:B.mes,lote:B.lote,nome:B.f.name,pdfBase64:b64,linhas:B.L.map(x=>({ref:x.l.ref,iban:x.l.iban,v:x.l.v,estado:x.l.estado,desc:x.l.desc,contrato:x.c?x.c.id:null,nome:x.c?x.c.nome:null,aplicado:!!x.ok})),resumo:B.R.meta})}catch(e){toast('PDF não guardado: '+(e.message||e))}}
 BANCO=null;document.getElementById('mx').classList.remove('on');toast(n+' débito(s) atualizados'+(f?' · '+f+' falharam':'')+'. Veja «Faturar / contactar».')}
/* lista para a Mariana */
function ddMariana(mes){mes=mes||LA;const fat=[],ko=[],por=[];C.forEach(c=>c.deb.forEach((d,i)=>{if(d.m!==mes||d.pd||!(d.v>0))return;const x={c,d,i};if(d.s==='fat')fat.push(x);else if(d.s==='falta'&&!d.relan&&!d.dism)ko.push(x);else if(!d.s&&c.meio!=='transferencia')por.push(x)}));
 const L=(a,btn)=>a.length?`<table class="tb" style="width:100%;font-size:12.5px">${a.sort((p,q)=>p.c.nome.localeCompare(q.c.nome)).map(x=>`<tr><td><b>${esc(x.c.nome)}</b> ${uniTag(x.c.uni)}</td><td class="mini">${esc(ddNRef(x.c.aut||x.c.ref))}</td><td class="num">${eur(x.d.v)}</td><td class="mini">${x.d.banco?esc(x.d.banco.lote)+(x.d.banco.desc?' · '+esc(x.d.banco.desc):''):''}</td><td>${btn(x)}</td></tr>`).join('')}</table>`:'<p class="mini">Nada.</p>';
 const tot=a=>eur(a.reduce((s,x)=>s+x.d.v,0));
 modalHtml(`<h2>Débitos de ${mLab(mes)} · faturar e contactar</h2><div class="seg" style="margin:6px 0 12px">${[addM(mes,-1),mes].map(m=>`<button class="${m===mes?'on':''}" onclick="ddMariana('${m}')">${mLab(m)}</button>`).join('')}</div>
 <div class="k">Para faturar — cobrados pelo banco (${fat.length} · ${tot(fat)})</div>${L(fat,x=>`<button class="btn sm g" onclick="ddMarFat('${x.c.id}',${x.i},'${mes}')">Faturado</button>`)}
 <div class="k" style="margin-top:14px;color:var(--ko)">Contactar — falharam (${ko.length} · ${tot(ko)})</div>${L(ko,x=>`<button class="btn sm" onclick="jaPagou('${x.c.id}',${x.i})">Pagou na clínica</button>`)}
 ${por.length?`<div class="k" style="margin-top:14px">Ainda sem resposta do banco (${por.length} · ${tot(por)})</div>${L(por,()=>'')}`:''}
 <div style="margin-top:12px"><button class="btn sm" onclick="ddCopiaLista('${mes}')">Copiar a lista</button></div>`)}
function ddMarFat(cid,i,mes){const d=C.find(x=>x.id===cid).deb[i];aplicaLA(d,'ok','Faturado');draw();ddMariana(mes)}
function ddCopiaLista(mes){const fat=[],ko=[];C.forEach(c=>c.deb.forEach(d=>{if(d.m!==mes||d.pd)return;if(d.s==='fat')fat.push(c.nome+' · '+ddNRef(c.aut||c.ref)+' · '+eur(d.v));if(d.s==='falta'&&!d.relan&&!d.dism)ko.push(c.nome+' · '+ddNRef(c.aut||c.ref)+' · '+eur(d.v)+(d.banco&&d.banco.desc?' · '+d.banco.desc:''))}));
 const t='Débitos diretos de '+mLab(mes)+'\n\nPARA FATURAR ('+fat.length+')\n'+fat.sort().join('\n')+'\n\nCONTACTAR — FALHARAM ('+ko.length+')\n'+ko.sort().join('\n');navigator.clipboard.writeText(t).then(()=>toast('Lista copiada.'),()=>alert(t))}

</script>
</body></html>
