<script>
/* Pica-ponto JMC no Supabase: as chamadas vão para a função "ponto" (antes: Google Apps Script). */
(function () {
  var SRV = 'https://piudosbhockofrtiieig.supabase.co/functions/v1/ponto';
  function runner(ok, ko) {
    return {
      withSuccessHandler: function (f) { return runner(f, ko); },
      withFailureHandler: function (f) { return runner(ok, f); },
      api: function (acao, args) {
        fetch(SRV, { method: 'POST', body: JSON.stringify({ fn: 'api', args: [acao, args] }) })
          .then(function (r) { return r.json(); })
          .then(function (o) { if (o && o.ok) { ok && ok(o.r); } else { ko && ko(new Error((o && o.erro) || 'Sem ligação. Tente outra vez.')); } }, function () { ko && ko(new Error('Sem ligação. Tente outra vez.')); });
      }
    };
  }
  window.google = { script: { run: runner(null, null) } };
  // anexos privados (justificações, assinaturas): abrem com a sessão de quem está no Ponto
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href^="' + SRV + '?f="]');
    if (!a || !window.S || !S.token) return;
    var u = a.getAttribute('href').replace(/&t=[^&]*/, '');
    a.setAttribute('href', u + '&t=' + encodeURIComponent(S.token));
  }, true);
})();
</script>

<style>
/* Layout: estilo iOS — vidro fosco no topo, cartões brancos sem contorno, teclado redondo como o ecrã de código do iPhone.
   Cores tiradas do ícone: dourado do aro, verde-petróleo dos ponteiros, turquesa do visto. */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #f2f2f5;
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --line: #e3e3e8;
  --gold: #b8963e;
  --gold-soft: #f6efdd;
  --petroleo: #0d4f47;
  --turquesa: #17b3ae;
  --entrada: #0d4f47; --entrada-ink: #ffffff;
  --saida: #c9a352;   --saida-ink: #1d1d1f;
  --accent: #0d4f47;
  --warn-bg: #fff4dc; --warn-ink: #8a5a00;
  --bad-bg: #ffe9e6; --bad-ink: #b4261a;
  --ok-bg: #e2f6f4; --ok-ink: #0b6b63;
  --info-bg: #eaf1fb; --info-ink: #24508a;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.06);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.05), 0 18px 50px rgba(0,0,0,.10);
  --f-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --r: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --ink: #f5f5f7; --muted: #98989f; --line: #38383a;
  --gold: #d6b566; --gold-soft: #3a3120; --petroleo: #2a9d8f; --turquesa: #30d0ca;
  --entrada: #1f8a7d; --saida: #d6b566; --saida-ink: #1d1d1f; --accent: #30d0ca;
  --warn-bg: #3a2e12; --warn-ink: #f5d38b; --bad-bg: #3d1a16; --bad-ink: #ff9f92; --ok-bg: #103a36; --ok-ink: #7ee3d9; --info-bg: #182a40; --info-ink: #a9c8ee;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 10px 40px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --ink: #f5f5f7; --muted: #98989f; --line: #38383a;
  --gold: #d6b566; --gold-soft: #3a3120; --petroleo: #2a9d8f; --turquesa: #30d0ca;
  --entrada: #1f8a7d; --saida: #d6b566; --saida-ink: #1d1d1f; --accent: #30d0ca;
  --warn-bg: #3a2e12; --warn-ink: #f5d38b; --bad-bg: #3d1a16; --bad-ink: #ff9f92; --ok-bg: #103a36; --ok-ink: #7ee3d9; --info-bg: #182a40; --info-ink: #a9c8ee;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 10px 40px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.47 var(--f-body); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--turquesa) 60%, transparent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -.025em; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }

/* ---------- barra superior (vidro) ---------- */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px;
  background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.marca { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
.marca img { width: 34px; height: 34px; }
.topo .sino { margin-right: auto; }
.sino { border: 0; display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px 7px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; }
.sino svg { width: 18px; height: 18px; }
.tag.urg { background: #ff3b30; color: #fff; } .tag.imp { background: rgba(255,159,10,.2); color: #b35c00; }
.escolhas.prio .escolha.on[data-v="importante"] { background: #ff9f0a; color: #fff; }
.escolhas.prio .escolha.on[data-v="urgente"] { background: #ff3b30; color: #fff; }
.sino.tem { background: rgba(255,159,10,.16); color: #b35c00; }
.sino.tem svg { animation: abana 2.4s ease-in-out infinite; transform-origin: 50% 10%; }
.sino.urgente { background: #ff3b30; color: #fff; }

.sino.novo { animation: pulsa 1s ease-in-out 3; }
@keyframes pulsa { 50% { transform: scale(1.12); box-shadow: 0 0 0 6px rgba(255,59,48,.25); } }
@keyframes abana { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(14deg); } 88% { transform: rotate(-12deg); } 92% { transform: rotate(8deg); } 96% { transform: rotate(-4deg); } }
@media (prefers-reduced-motion: reduce) { .sino.tem svg { animation: none; } }
.marca small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 0; box-shadow: var(--shadow); font-size: 14px; font-weight: 600; }
.chip .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--turquesa); }

/* ---------- terminal ---------- */
.ecra { min-height: calc(100% - 60px); display: grid; place-items: center; padding: 20px 16px 32px; }
.terminal { width: 100%; max-width: 960px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; }
.relogio h1 { font-size: clamp(72px, 11vw, 128px); line-height: .92; font-weight: 300; letter-spacing: -.045em; }
.relogio .data { margin-top: 12px; font-size: 21px; color: var(--muted); }
.relogio .dica { margin-top: 26px; max-width: 32ch; color: var(--muted); font-size: 17px; }
.teclado-caixa { background: var(--surface); border-radius: 32px; padding: 28px 30px 26px; box-shadow: var(--shadow-lg); justify-self: center; width: 100%; max-width: 380px; }
.teclado-titulo { text-align: center; font-weight: 600; font-size: 19px; margin-bottom: 14px; }
.visor { height: 28px; display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 22px; }
.visor .d { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink); transition: background .12s; }
.visor .d.on { background: var(--ink); }
.visor.erro { animation: abana .4s; }
.visor.erro .d { border-color: var(--bad-ink); }
@keyframes abana { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.teclas { display: grid; grid-template-columns: repeat(3, 78px); justify-content: center; gap: 16px 26px; }
.tecla { width: 78px; height: 78px; border: 0; border-radius: 50%; background: var(--surface-2); font-family: var(--f-display); font-size: 34px; font-weight: 400; display: grid; place-items: center; transition: background .15s, transform .08s; }
.tecla:hover { background: var(--line); }
.tecla:active { transform: scale(.94); background: color-mix(in srgb, var(--ink) 18%, var(--surface-2)); }
.tecla.fn { background: transparent; font-family: var(--f-body); font-size: 16px; font-weight: 500; color: var(--ink); }
.tecla.fn svg { width: 30px; height: 30px; }
.entrar-btn { margin-top: 22px; width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 17px; transition: opacity .15s; }
.entrar-btn:disabled { opacity: .25; cursor: default; }
.msg-erro { min-height: 22px; margin-top: 12px; text-align: center; color: var(--bad-ink); font-weight: 500; font-size: 15px; }

/* ---------- ecrã da pessoa ---------- */
.pessoa { width: 100%; max-width: 860px; display: grid; gap: 20px; }
.pessoa-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.pessoa-topo h1 { font-size: clamp(34px, 5vw, 48px); }
.pessoa-topo .sub { color: var(--muted); margin-top: 4px; }
.sair-btn { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 10px 18px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.tempo { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.tempo i { display: block; height: 100%; background: var(--turquesa); width: 100%; transition: width 1s linear; }
.aviso { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 18px; background: var(--warn-bg); color: var(--warn-ink); }
.aviso b { font-weight: 600; }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #ff3b30; color: #fff; font-size: 12px; font-weight: 600; vertical-align: 2px; margin-left: 4px; }
.aviso-sug { border: 0; width: 100%; text-align: left; background: var(--info-bg); color: var(--info-ink); cursor: pointer; font: inherit; }
.item.sugestao { background: var(--info-bg); }
.botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grande { position: relative; border: 0; border-radius: 26px; padding: 26px 24px; text-align: left; display: grid; gap: 4px; min-height: 168px; align-content: end; box-shadow: var(--shadow); transition: transform .12s, box-shadow .2s; overflow: hidden; }
.grande:hover { box-shadow: var(--shadow-lg); }
.grande:active { transform: scale(.98); }
.grande .t { font-family: var(--f-display); font-size: clamp(32px, 5vw, 44px); font-weight: 700; line-height: 1; letter-spacing: -.03em; }
.grande .s { font-size: 16px; opacity: .8; }
.grande::before { position: absolute; top: 22px; left: 24px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 700; line-height: 1; background: color-mix(in srgb, currentColor 14%, transparent); }
.grande.entrada::before { content: '→'; }
.grande.saida::before { content: '←'; }
.grande.entrada { background: linear-gradient(160deg, color-mix(in srgb, var(--entrada) 82%, white), var(--entrada)); color: var(--entrada-ink); }
.grande.saida { background: linear-gradient(160deg, color-mix(in srgb, var(--saida) 70%, white), var(--saida)); color: var(--saida-ink); }
.grande.fraco { background: var(--surface); color: var(--ink); }
.grande.fraco.entrada .t { color: var(--entrada); }
.grande.fraco.saida .t { color: var(--gold); }
.hoje-linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; }
.estado-hoje { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 9px 16px 9px 12px; display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--ink); }
.estado-hoje .pt { width: 10px; height: 10px; border-radius: 50%; background: var(--turquesa); box-shadow: 0 0 0 4px color-mix(in srgb, var(--turquesa) 20%, transparent); }
.estado-hoje.falta .pt { background: #ff9f0a; box-shadow: 0 0 0 4px rgba(255,159,10,.2); }
.estado-hoje .ver { font-weight: 500; color: var(--azul, #0071e3); font-size: 14px; }
.estado-hoje:disabled { cursor: default; }
#horasHoje { display: inline-flex; flex-wrap: wrap; gap: 6px; }
#horasHoje[hidden] { display: none; }
.recados { display: grid; gap: 10px; }
.recado { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: 18px; background: rgba(23,179,174,.12); box-shadow: inset 0 0 0 1.5px rgba(23,179,174,.45); }
.recado.imp { background: rgba(255,159,10,.14); box-shadow: inset 0 0 0 1.5px rgba(255,159,10,.55); }
.recado.urg { background: rgba(255,59,48,.10); box-shadow: inset 0 0 0 1.5px rgba(255,59,48,.6); }
.recado .rc-i { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); font-size: 18px; flex: none; }
.recado .rc-t { font-size: 17px; font-weight: 600; margin-top: 2px; white-space: pre-wrap; }
.avisar-cartao { width: 100%; border: 0; text-align: left; display: flex; align-items: center; gap: 14px; cursor: pointer; }
.avisar-cartao .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,159,10,.16); color: #e07800; font-weight: 800; font-size: 20px; flex: none; }
.avisar-cartao .av-t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.avisar-cartao .av-t span { color: var(--muted); font-size: 14px; }
.avisar-cartao:hover { box-shadow: var(--shadow-lg); }
.dmapa { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed; }
.dmapa th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 2px 6px; }
.dmapa th.sem { width: 92px; }
.dmapa td { vertical-align: top; background: var(--surface-2); border-radius: 10px; padding: 6px 7px; font-size: 12.5px; height: 58px; }
.dmapa .dh { margin-top: 3px; padding-top: 3px; border-top: 1px solid var(--line); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dmapa .dh .pos { font-weight: 700; } .dmapa .dh .neg { font-weight: 600; }
.dmapa td.excesso { box-shadow: inset 0 0 0 1.5px rgba(10,122,85,.55); }
.dmapa td[data-dia] { cursor: pointer; } .dmapa td[data-dia]:hover { box-shadow: inset 0 0 0 2px var(--turquesa); }
.dmapa .guardada { margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--ok-ink); }
.dmapa td.tot .btn { margin-top: 4px; padding: 4px 8px; font-size: 11.5px; }
.calc-viagem { display: grid; gap: 12px; } .calc-viagem label[hidden] { display: none; }
.calc-res { padding: 10px 14px; border-radius: 12px; background: var(--surface-2); font-size: 15px; font-variant-numeric: tabular-nums; }
.mapa-viagens { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); font-size: 14px; }
.dmapa th.tot { width: 104px; text-align: right; }
.dmapa td.tot { background: transparent; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.dmapa td.sem { background: transparent; font-size: 12px; color: var(--muted); padding-left: 2px; }
.dmapa td.fds { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }
.dmapa td.fer { background: rgba(201,163,82,.18); }
.dmapa td.ferias { background: rgba(23,179,174,.16); }
.dmapa td.semreg { background: rgba(255,59,48,.08); box-shadow: inset 0 0 0 1.5px #ff3b30; }
.dmapa td.futuro { opacity: .45; }
.dmapa .d { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 4px; }
.dmapa .bl { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.dmapa .bl .t { color: #c25e00; }
.dmapa .rot { font-size: 11.5px; font-weight: 600; }
.dmapa select { width: 100%; margin-top: 3px; font-size: 12px; padding: 3px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.dmapa .lp { border: 0; background: none; color: var(--muted); font-size: 11px; padding: 0; text-decoration: underline; }
.vista-horas { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.vista-horas button { border: 0; background: none; padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.vista-horas button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--ink); }
.tag.e { background: var(--ok-bg); color: var(--ok-ink); }
.tag.s { background: var(--gold-soft); color: var(--warn-ink); }
.tag.t { background: var(--warn-bg); color: var(--warn-ink); }
.tag.i { background: var(--info-bg); color: var(--info-ink); }
.acoes { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 12px; }
.acao-ferias { grid-row: span 3; position: relative; overflow: hidden; padding: 0; min-height: 204px; align-content: end; background: #eaf8f7; }
.acao-ferias .praia { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .4s ease; }
.acao-ferias:hover .praia { transform: scale(1.04); }
.acao-ferias .af-texto { position: relative; display: grid; gap: 0; margin: 12px; padding: 10px 14px; border-radius: 14px; background: color-mix(in srgb, #ffffff 72%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #1d1d1f; justify-self: start; }
.acao-ferias .af-texto b { font-size: 22px; letter-spacing: -.02em; }
.acao-ferias .af-texto span { font-size: 13px; color: #4a4a4f; }
.acao { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 20px; padding: 16px; text-align: left; display: grid; gap: 4px; align-content: start; min-height: 96px; transition: transform .12s, box-shadow .2s; }
.acao b { font-weight: 600; font-size: 16px; letter-spacing: -.015em; }
.acao span { font-size: 13px; color: var(--muted); }
.acao:hover { box-shadow: var(--shadow-lg); }
.acao:active { transform: scale(.98); }
.cartao { background: var(--surface); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); }
.cartao.destaque { box-shadow: 0 0 0 2px var(--turquesa), var(--shadow); }
.linha-flex { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ---------- resultado ---------- */
.resultado { width: 100%; max-width: 620px; text-align: center; display: grid; gap: 18px; justify-items: center; }
.selo { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; color: #fff; box-shadow: 0 0 0 6px var(--surface), 0 0 0 9px var(--gold), var(--shadow-lg); animation: surge .45s cubic-bezier(.2,1.4,.4,1); }
.selo svg { width: 58px; height: 58px; }
@keyframes surge { from { transform: scale(.5); opacity: 0; } }
.resultado h1 { font-size: clamp(36px, 6vw, 54px); }
.resultado .hora { font-size: 21px; color: var(--muted); }
.frase { background: var(--surface); border-radius: 22px; padding: 22px 24px; box-shadow: var(--shadow); font-size: 20px; line-height: 1.4; max-width: 34ch; }
.frase .emo { font-size: 34px; display: block; margin-bottom: 6px; }

/* ---------- folhas (modais) ---------- */
.veu { position: fixed; inset: 0; background: rgba(0,0,0,.28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: grid; place-items: end center; z-index: 20; padding: 16px; animation: aparece .18s; }
@media (min-width: 700px) { .veu { place-items: center; } }
@keyframes aparece { from { opacity: 0; } }
.folha { width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: 28px; padding: 26px; display: grid; gap: 16px; box-shadow: var(--shadow-lg); animation: sobe .25s cubic-bezier(.2,.9,.3,1); }
@keyframes sobe { from { transform: translateY(24px); opacity: .6; } }
.folha h2 { font-size: 26px; }
.folha p { margin: 0; color: var(--muted); }
.campo { display: grid; gap: 6px; }
.campo label { font-size: 14px; font-weight: 600; color: var(--muted); }
.campo input, .campo select, .campo textarea { width: 100%; padding: 13px 15px; border: 0; border-radius: 12px; background: var(--surface-2); font-size: 17px; min-width: 0; }
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: 2px solid var(--turquesa); }
.campo textarea { min-height: 90px; resize: vertical; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.botoes-folha { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; background: var(--ink); color: var(--bg); transition: opacity .15s, transform .08s; }
.btn:active { transform: scale(.97); }
.btn.sec { background: var(--surface-2); color: var(--ink); }
.btn.verde { background: var(--entrada); color: #fff; }
.btn.laranja { background: var(--saida); color: var(--saida-ink); }
.btn.peq { padding: 7px 13px; font-size: 14px; border-radius: 10px; }
.btn.wa { background: #25d366; color: #fff; text-decoration: none; display: inline-flex; align-items: center; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.wa-caixa { background: #e5ddd5; border-radius: 16px; padding: 14px; }
.wa-bolha { background: #dcf8c6; color: #111; border-radius: 10px 10px 2px 10px; padding: 10px 12px; font-size: 15px; max-width: 92%; margin-left: auto; box-shadow: 0 1px 1px rgba(0,0,0,.1); word-break: break-word; }
.horario-grande { padding: 16px; }
.folha.folha-larga { max-width: min(1100px, calc(100vw - 32px)); }
.recorte { position: relative; user-select: none; touch-action: none; cursor: crosshair; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); background: #fff; max-height: 64vh; overflow-y: auto; }
.recorte img { display: block; width: 100%; height: auto; pointer-events: none; }
.rc-sel { position: absolute; border: 2px solid var(--turquesa); background: rgba(23,179,174,.12); box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
.hp-previa { margin-top: 10px; }
.hp-previa figure { margin: 0; } .hp-previa figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
.hp-previa.duas-prev { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .hp-previa.duas-prev .linha-flex { grid-column: 1 / -1; }
.item.opc { width: 100%; border: 0; text-align: left; cursor: pointer; } .item.opc:hover { box-shadow: inset 0 0 0 2px var(--turquesa); }
.hp-previa img { display: block; width: 100%; max-height: 240px; object-fit: contain; object-position: left top; background: #fff; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); }
.horario-img { display: block; width: 100%; border: 0; padding: 0; background: #fff; border-radius: 12px; overflow: hidden; cursor: zoom-in; box-shadow: inset 0 0 0 1px var(--line); }
.horario-img img { display: block; width: 100%; height: auto; }
.horario-pdf { display: block; width: 100%; height: min(78vh, 760px); border: 0; border-radius: 12px; background: #fff; }
.horario-vazio { display: flex; align-items: center; gap: 14px; }
.horario-vazio .ic, .horario-cartao .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok-ink); font-weight: 700; flex: none; }
.horario-ecra { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.85); display: grid; place-items: center; padding: 16px; overflow: auto; cursor: zoom-out; }
.horario-ecra img { max-width: 100%; max-height: calc(100vh - 90px); border-radius: 10px; background: #fff; }
.horario-ecra .btn { position: fixed; top: 16px; right: 16px; }
.horario-cartao { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; text-decoration: none; color: inherit; }
.horario-cartao .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok-ink); font-weight: 700; flex: none; }
.btn:disabled { opacity: .4; cursor: default; }
.escolhas { display: flex; flex-wrap: wrap; gap: 8px; }
.escolha { border: 0; background: var(--surface-2); border-radius: 999px; padding: 10px 16px; font-weight: 500; transition: background .15s; }
.escolha.on { background: var(--ink); color: var(--bg); font-weight: 600; }
.hora-grande { font-family: var(--f-display); font-size: 40px !important; font-weight: 300; text-align: center; padding: 10px !important; }
.assina { width: 100%; height: 180px; border: 2px dashed var(--line); border-radius: 14px; background: var(--surface-2); touch-action: none; }
.doc-formacao { background: var(--surface-2); border-radius: 14px; padding: 14px 16px; font-size: 15px; display: grid; gap: 6px; }
.lista { display: grid; gap: 8px; }
.item { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); flex-wrap: wrap; }
.item .meta { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: color-mix(in srgb, var(--ink) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 600; z-index: 40; max-width: calc(100% - 32px); box-shadow: var(--shadow-lg); }
.carrega { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 40%, transparent); z-index: 30; }
.carrega i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--turquesa); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

/* ---------- supervisão ---------- */
.sup { width: 100%; max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 18px; }
.sup-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.sup-topo h1 { font-size: 34px; }
.separadores { display: inline-flex; gap: 2px; overflow-x: auto; padding: 3px; background: color-mix(in srgb, var(--ink) 7%, transparent); border-radius: 12px; max-width: 100%; justify-self: start; }
.sep { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font-weight: 500; font-size: 15px; color: var(--ink); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.sep.on { background: var(--surface); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.sep .n { background: #ff3b30; color: #fff; border-radius: 999px; font-size: 12px; font-weight: 600; padding: 1px 7px; }
.grelha { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.cartao h3 { font-size: 19px; margin-bottom: 12px; }
.vazio { color: var(--muted); font-size: 15px; }
.alerta { display: grid; grid-template-columns: 4px 1fr auto; gap: 14px; align-items: center; padding: 12px 14px 12px 0; border-radius: 14px; background: var(--surface-2); }
.alerta .faixa { align-self: stretch; border-radius: 14px 0 0 14px; background: var(--gold); }
.alerta.critico .faixa { background: #ff3b30; }
.alerta .d { min-width: 0; }
.alerta .d b { display: block; font-weight: 600; }
.alerta .d span { font-size: 14px; color: var(--muted); }
.tabela-caixa { overflow-x: auto; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
table.semana { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 14px; }
table.semana th, table.semana td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
table.semana tr:last-child td { border-bottom: 0; }
table.semana th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
table.semana td.nome { font-weight: 600; white-space: nowrap; }
table.semana td.tot { font-family: var(--f-display); font-size: 20px; font-weight: 600; white-space: nowrap; }
.bloco { font-variant-numeric: tabular-nums; white-space: nowrap; }
.bloco.tardio { color: var(--warn-ink); }
.dia-h { font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.celula { display: grid; gap: 4px; cursor: pointer; border-radius: 10px; padding: 4px; margin: -4px; }
.celula:hover { background: var(--surface-2); }
.mini { display: flex; gap: 4px; flex-wrap: wrap; }
.mini .tag { font-size: 11px; padding: 2px 8px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .cab { font-size: 12px; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: center; }
.cal .dia { min-height: 92px; background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 7px; display: grid; align-content: start; gap: 4px; font-size: 12px; min-width: 0; }
.cal .dia.fora { opacity: .35; }
.cal .dia.hoje .n { background: #ff3b30; color: #fff; border-radius: 999px; padding: 0 7px; justify-self: start; }
.cal .dia .n { font-weight: 600; font-size: 13px; }
.cal .ev { border-radius: 6px; padding: 2px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal .ev.ferias { background: var(--ok-bg); color: var(--ok-ink); }
.cal .ev.saida, .cal .ev.ausencia, .cal .ev.entrar_tarde, .cal .ev.sair_cedo { background: var(--info-bg); color: var(--info-ink); }
.cal .ev.falta { background: var(--bad-bg); color: var(--bad-ink); }
.cal .ev.feriado { color: var(--gold); font-weight: 600; background: var(--gold-soft); }
.cal .ev.ferias_disponivel { background: color-mix(in srgb, var(--turquesa) 14%, transparent); color: var(--ok-ink); }
.cal .ev.ferias_bloqueado, .cal .ev.encerramento { background: var(--surface-2); color: var(--muted); }
.cal .ev.pendente { outline: 1px dashed currentColor; }
.cal .ev.formacao, .tag.form { background: rgba(175,82,222,.14); color: #8e3cb8; }
.btn.ativo { box-shadow: 0 0 0 3px color-mix(in srgb, var(--turquesa) 35%, transparent); }
.barra-ferias { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; display: flex; }
.barra-ferias i { display: block; height: 100%; background: var(--turquesa); }
.barra-ferias i.p { background: var(--gold); opacity: .6; }
table.equipa { width: 100%; border-collapse: collapse; font-size: 15px; }
table.equipa td, table.equipa th { padding: 11px 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.equipa th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.horas-clinica { font-size: 22px; margin: 22px 0 10px; }
.horas-cartao { margin-bottom: 14px; }
.params { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; color: var(--muted); }
.params label { display: inline-flex; align-items: center; gap: 6px; }
.params input { width: 64px; padding: 7px 8px; border: 0; border-radius: 9px; background: var(--surface-2); font-size: 15px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.horas-periodo label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.horas-periodo input { padding: 7px 10px; border: 0; border-radius: 9px; background: var(--surface); box-shadow: var(--shadow); font-size: 15px; }
table.horas-t, table.horas-g { min-width: 760px; }
table.horas-t td.num, table.horas-g td.num, table.horas-t th, table.horas-g th { text-align: right; }
table.horas-t td.nome, table.horas-g td.nome, table.horas-t th:first-child, table.horas-g th:first-child { text-align: left; }
table.horas-t tr.total td { border-top: 2px solid var(--line); font-weight: 600; }
table.horas-g tr.grupo td { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface-2); padding: 6px 10px; }
.pos { color: var(--ok-ink); font-weight: 600; }
.por-pagar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
.pp-valor { font-size: 22px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
table.horas-t tr.pago td { opacity: .55; }
.neg { color: var(--bad-ink); }
.codigo { font-family: var(--f-display); font-weight: 600; letter-spacing: .14em; font-variant-numeric: tabular-nums; }

/* inserido */
/* ---------- as minhas férias ---------- */
.ferias-ecra { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px 16px 120px; display: grid; gap: 18px; }
.ferias-ecra h1 { font-size: clamp(30px, 4vw, 40px); }
.ano-nav { display: flex; align-items: center; gap: 12px; font-size: 19px; }
.resumo-ferias { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.resumo-ferias div { background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; }
.resumo-ferias b { font-size: 30px; font-weight: 600; letter-spacing: -.03em; }
.resumo-ferias span { font-size: 13px; color: var(--muted); }
.legenda { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 14px; height: 14px; border-radius: 5px; display: inline-block; }
.fm-ano { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.fm-mes { background: var(--surface); border-radius: 18px; padding: 12px 12px 10px; box-shadow: var(--shadow); min-width: 0; }
.fm-nome { font-weight: 600; font-size: 15px; margin: 0 0 8px 4px; color: var(--ink); }
.fm-grelha { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
.fm-cab { font-size: 10px; color: var(--muted); font-weight: 600; padding-bottom: 3px; }
.fm-d { position: relative; border: 0; background: transparent; aspect-ratio: 1; border-radius: 50%; font-size: 12px; font-variant-numeric: tabular-nums; padding: 0; color: var(--ink); min-width: 0; }
.fm-d:hover { background: var(--surface-2); }
.fm-d.fds, .lg.fds { color: var(--muted); background: color-mix(in srgb, var(--ink) 4%, transparent); }
.lg.fds { background: color-mix(in srgb, var(--ink) 10%, transparent); }
.fm-d.ferias_disponivel, .lg.ferias_disponivel { background: color-mix(in srgb, var(--turquesa) 16%, transparent); border-radius: 6px; }
.fm-d.ferias_bloqueado, .lg.ferias_bloqueado { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--ink) 12%, transparent) 0 3px, transparent 3px 6px); color: var(--muted); border-radius: 6px; }
.fm-d.encerramento { background: color-mix(in srgb, var(--ink) 14%, transparent); border-radius: 6px; }
.fm-d.fer, .lg.fer { color: var(--gold); font-weight: 700; }
.lg.fer { background: var(--gold); }
.fm-d.fer::after { content: ''; position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--gold); }
.fm-d.fac::after { content: ''; position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; border: 1px solid var(--gold); box-sizing: border-box; }
.fm-d.minha, .lg.minha { background: var(--petroleo); color: #fff; border-radius: 6px; }
.fm-d.minha-p, .lg.minha-p { box-shadow: inset 0 0 0 1.5px var(--petroleo); color: var(--petroleo); font-weight: 600; border-radius: 6px; }
.lg.minha-p { background: transparent; }
.fm-d.sel { background: var(--turquesa) !important; color: #fff !important; border-radius: 6px; }
.fm-d.hj { box-shadow: inset 0 0 0 1.5px #ff3b30; }
.barra-sel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(680px, calc(100% - 32px)); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px 14px 20px; border-radius: 22px; z-index: 15;
  background: color-mix(in srgb, var(--surface) 82%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: var(--shadow-lg); animation: sobe .25s; }
.barra-sel b { display: block; }
.barra-sel span { font-size: 14px; color: var(--muted); }
@media (max-width: 960px) { .fm-ano { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .fm-ano { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .resumo-ferias b { font-size: 24px; } .fm-mes { padding: 10px 8px; } }

/* ---------- ecrã inicial: emblema ---------- */
.relogio { display: grid; justify-items: center; text-align: center; }
.emblema { position: relative; width: 168px; height: 168px; display: grid; place-items: center; margin-bottom: 14px; }
.emblema::before { content: ''; position: absolute; inset: -18px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--gold) 22%, transparent) 0%, transparent 68%); }
.emblema img { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 14px 26px rgba(0,0,0,.16)); }
.assinatura-marca { font-size: 12px; letter-spacing: .42em; text-transform: uppercase; color: var(--gold); font-weight: 500; margin: 0 0 18px .42em; }

@media (max-width: 760px) {
  .terminal { grid-template-columns: 1fr; gap: 22px; }
  .relogio { text-align: center; }
  .emblema { width: 96px; height: 96px; margin-bottom: 6px; }
  .assinatura-marca { margin-bottom: 10px; }
  .relogio .dica { display: none; }
  .teclas { grid-template-columns: repeat(3, 72px); gap: 14px 22px; }
  .tecla { width: 72px; height: 72px; }
  .acoes { grid-template-columns: 1fr 1fr; }
  .acoes .acao:first-child { grid-column: 1 / -1; grid-row: auto; min-height: 210px; }
  .grande { min-height: 136px; padding: 20px 18px; }
  .grande::before { top: 16px; left: 18px; }
  .duas { grid-template-columns: 1fr; }
  .cal .dia { min-height: 64px; }
  .cal .ev { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

var $app = document.getElementById('app'), $camada = document.getElementById('camada');
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function lerClinica() { try { return localStorage.getItem('jmc_ponto_clinica') || ''; } catch (e) { return ''; } }
function gravarClinica(c) { S.clinica = c; try { if (c) localStorage.setItem('jmc_ponto_clinica', c); else localStorage.removeItem('jmc_ponto_clinica'); } catch (e) {} mostrarClinica(); }
function mostrarClinica() { document.getElementById('nomeClinica').textContent = S.clinica ? 'Terminal ' + S.clinica : 'Aparelho pessoal'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function p2(n) { return (n < 10 ? '0' : '') + n; }
function agora() { return window.DEMO_AGORA ? window.DEMO_AGORA() : new Date(); }
function hojeStr() { var d = agora(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function dataPT(s) { if (!s) return ''; var p = s.split('-'); return p[2] + '/' + p[1]; }
function dataLonga(s) { var p = s.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return DIAS[d.getDay()] + ', ' + (+p[2]) + ' de ' + MESES[+p[1] - 1]; }
function horasFmt(h) { h = Math.max(0, Number(h) || 0); var m = Math.round(h * 60); return Math.floor(m / 60) + 'h' + p2(m % 60); }
function toast(t) { var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 3200); }
function aCarregar(on) { var el = document.getElementById('carrega'); if (on && !el) { el = document.createElement('div'); el.id = 'carrega'; el.className = 'carrega'; el.innerHTML = '<i></i>'; document.body.appendChild(el); } if (!on && el) el.remove(); }
function chamar(acao, args) { aCarregar(true); return api(acao, args).then(function (r) { aCarregar(false); return r; }, function (e) { aCarregar(false); throw e; }); }

/* ======================= inatividade ======================= */
function iniciarTempo(seg) {
  pararTempo(); S.segundos = seg; S.total = seg;
  S.inatividade = setInterval(function () {
    S.segundos--; var b = document.querySelector('.tempo i'); if (b) b.style.width = (100 * S.segundos / S.total) + '%';
    if (S.segundos <= 0) terminarSessao();
  }, 1000);
}
function pararTempo() { if (S.inatividade) clearInterval(S.inatividade); S.inatividade = null; }
['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function () { if (S.inatividade) S.segundos = S.total; }, true); });
function terminarSessao() { pararTempo(); S.token = null; S.eu = null; S.sup = null; document.getElementById('sino').hidden = true; fecharFolha(); ecraTeclado(); }

/* ======================= 1. teclado ======================= */
var codigo = '';
function ecraTeclado() {
  codigo = '';
  var apagar = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>';
  $app.innerHTML =
    '<section class="ecra"><div class="terminal">' +
      '<div class="relogio"><div class="emblema"><img src="' + ICONE + '" alt="Ponto Jesus Mar Couto"></div><div class="assinatura-marca">Jesus Mar Couto</div><h1 class="num" id="relogio">--:--</h1><div class="data" id="dataHoje"></div>' +
      '<p class="dica">Introduza o seu código pessoal para registar a entrada ou a saída, fazer um pedido ou enviar um documento.</p></div>' +
      '<div class="teclado-caixa">' +
        '<div class="teclado-titulo">Introduza o seu código</div>' +
        '<div class="visor" id="visor"></div>' +
        '<div class="teclas">' + [1,2,3,4,5,6,7,8,9].map(function (n) { return '<button class="tecla" data-n="' + n + '">' + n + '</button>'; }).join('') +
        '<button class="tecla fn" data-a="limpar">Limpar</button><button class="tecla" data-n="0">0</button><button class="tecla fn" data-a="apagar" aria-label="Apagar">' + apagar + '</button></div>' +
        '<div class="msg-erro" id="erroCod"></div>' +
      '</div></div></section>';
  $app.querySelectorAll('.tecla').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.n != null) { if (codigo.length < 6) codigo += b.dataset.n; }
      else if (b.dataset.a === 'limpar') codigo = '';
      else if (b.dataset.a === 'apagar') codigo = codigo.slice(0, -1);
      desenharVisor(); aposDigito();
    });
  });
  desenharVisor();
  tiqueRelogio();
}
function desenharVisor() {
  var v = document.getElementById('visor'); if (!v) return;
  document.getElementById('erroCod').textContent = '';
  v.classList.remove('erro');
  var n = codigo.length > 4 ? 6 : 4, h = '';
  for (var i = 0; i < n; i++) h += '<span class="d' + (i < codigo.length ? ' on' : '') + '"></span>';
  v.innerHTML = h;
}
document.addEventListener('keydown', function (e) {
  if (!document.getElementById('visor') || $camada.innerHTML) return;
  if (/^\d$/.test(e.key) && codigo.length < 6) { codigo += e.key; desenharVisor(); aposDigito(); }
  else if (e.key === 'Backspace') { codigo = codigo.slice(0, -1); desenharVisor(); aposDigito(); }
});
/* Entra sozinho: aos 4 algarismos (assistentes) tenta logo; se não for, espera um pouco
   por mais 2 algarismos (códigos de 6 da supervisão) antes de dizer que o código está errado. */
var esperaCodigo = null, aEntrar = false;
function aposDigito() {
  clearTimeout(esperaCodigo);
  if (aEntrar) return;
  if (codigo.length === 4 || codigo.length === 6) tentarCodigo(codigo);
}
function tentarCodigo(c, quem) {
  aEntrar = true;
  api('entrar', { codigo: c, clinica: S.clinica || '', quem: quem || '' }).then(function (r) {
    aEntrar = false;
    if (r.escolher) { // o mesmo código é de mais de uma pessoa (no fecho de caixa): pergunta quem é
      abrirFolha('<h2>Quem é?</h2><div class="lista">' + r.escolher.map(function (x) { return '<button class="item opc" data-quem="' + esc(x.id) + '"><b>' + esc(x.nome) + '</b></button>'; }).join('') + '</div><div class="botoes-folha"><button class="btn sec" id="qC">Cancelar</button></div>');
      document.querySelectorAll('[data-quem]').forEach(function (b) { b.onclick = function () { fecharFolha(); tentarCodigo(c, b.dataset.quem); }; });
      document.getElementById('qC').onclick = function () { fecharFolha(); codigo = ''; desenharVisor(); };
      return;
    }
    S.token = r.token; S.eu = r.eu;
    if (r.eu.papel === 'supervisor') ecraSupervisao(); else ecraPessoa();
  }, function (e) {
    aEntrar = false;
    if (codigo !== c) return aposDigito();               // continuou a escrever entretanto
    if (e.dados && e.dados.talvezMais) {                   // início de um código de 6: espera pelos outros 2
      esperaCodigo = setTimeout(function () { if (codigo === c) { codigo = ''; desenharVisor(); erroCodigo('Código incompleto.'); } }, 6000);
      return;
    }
    codigo = ''; desenharVisor(); erroCodigo(e.message);
  });
}
function erroCodigo(t) { var v = document.getElementById('visor'); v.classList.add('erro'); document.getElementById('erroCod').textContent = t; }
function tiqueRelogio() {
  var r = document.getElementById('relogio'); if (!r) return;
  var d = agora(); r.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes());
  var ds = DIAS[d.getDay()]; document.getElementById('dataHoje').textContent = ds.charAt(0).toUpperCase() + ds.slice(1) + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()];
}
setInterval(tiqueRelogio, 5000);

/* ======================= 2. ecrã da assistente ======================= */
function ecraPessoa() {
  var eu = S.eu, f = eu.funcoes || {};
  var sug = eu.sugestao;
  // Sem horas à vista: só o estado do dia. As horas aparecem se tocar no estado.
  var temE = eu.hoje.some(function (x) { return x.tipo === 'Entrada'; }), temS = eu.hoje.some(function (x) { return x.tipo === 'Saída'; });

  document.getElementById('btnSaida').onclick = function () { picar('Saída', {}); };

function picar(tipo, extra) {
  chamar('picar', { token: S.token, tipo: tipo, clinica: S.clinica, extra: extra }).then(function (r) {
    if (r.precisa === 'almoco') return perguntarAlmoco(tipo, r, extra);
    if (r.precisa) return perguntarHora(tipo, r, extra);
    fecharFolha(); ecraResultado(r);
  }, function (e) { var el = document.getElementById('erroH') || document.getElementById('erroA'); if (el && !/sessão/i.test(e.message)) el.textContent = e.message; else erroSessao(e); });
}

function urlVerHorario(h) {

  if (/^data:image|\.(jpe?g|png|webp)(\?|$)/i.test(h.url)) return { tipo: 'img', src: h.url };
  if (h.ficheiroId && /^image\//.test(h.mime)) return { tipo: 'img', src: 'https://drive.google.com/thumbnail?id=' + h.ficheiroId + '&sz=w2400' };
  if (h.ficheiroId) return { tipo: 'pdf', src: 'https://drive.google.com/file/d/' + h.ficheiroId + '/preview' };
  if (/^data:application\/pdf/.test(h.url)) return { tipo: 'pdf', src: h.url };
  return { tipo: 'link', src: h.url };

var MESES_C = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

  var i = { feriado: '', periodo: '', minha: '' };
  mp.feriados.forEach(function (f) { if (f.data === d) i.feriado = f; });
  mp.periodos.forEach(function (c) { if (c.inicio <= d && c.fim >= d) i.periodo = c; });
  mp.minhas.forEach(function (m) { if (m.inicio <= d && m.fim >= d) i.minha = m.estado; });
  return i;
}
function desenharFerias() {

      if (inf.minha) cls.push(inf.minha === 'aceite' ? 'minha' : 'minha-p');

      cels += '<button class="' + cls.join(' ') + '" data-d="' + d + '"' + (tit ? ' title="' + esc(tit) + '"' : '') + '>' + dd + '</button>';

  }
  var proximos = mp.feriados.filter(function (f) { return f.data >= mp.hoje; }).slice(0, 6);

function supCalendario() {

/* ---------- Recortar o horário antes de publicar (PDF ou imagem) ----------

   para as assistentes o verem logo na app, sem abrir nada. */
var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function carregarPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (S._pdfjs) return S._pdfjs;
  S._pdfjs = new Promise(function (res, rej) {
    var sc = document.createElement('script'); sc.src = PDFJS_URL;
    sc.onload = function () {
      fetch(PDFJS_WORKER).then(function (r) { return r.text(); }).then(function (t) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' }));
        res(window.pdfjsLib);
      }, function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; res(window.pdfjsLib); });
    };
    sc.onerror = function () { S._pdfjs = null; rej(new Error('Não foi possível abrir o PDF. Experimente com uma imagem (JPEG ou PNG).')); };
    document.head.appendChild(sc);
  });
  return S._pdfjs;
}
function ficheiroParaImagens(f) {
  // devolve uma lista de imagens (uma por página do PDF; uma só para imagens)
  var lerUrl = function () { return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.onerror = function () { rej(new Error('Não foi possível ler o ficheiro.')); }; fr.readAsDataURL(f); }); };
  if (/pdf/.test(f.type) || /\.pdf$/i.test(f.name)) {
    return carregarPdfJs().then(function (lib) { return f.arrayBuffer().then(function (buf) { return lib.getDocument({ data: buf }).promise; }); }).then(function (pdf) {
      var paginas = []; for (var i = 1; i <= Math.min(pdf.numPages, 6); i++) paginas.push(i);
      return Promise.all(paginas.map(function (n) { return pdf.getPage(n).then(function (pg) {
        var v1 = pg.getViewport({ scale: 1 }), esc2 = Math.min(3, 2200 / v1.width), vp = pg.getViewport({ scale: esc2 });
        var c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        return pg.render({ canvasContext: ctx, viewport: vp }).promise.then(function () { return c.toDataURL('image/png'); });
      }); }));
    });
  }
  if (!/^image\//.test(f.type)) return Promise.reject(new Error('Escolha um PDF ou uma imagem.'));
  return lerUrl().then(function (u) { return [u]; });
}
function abrirRecorte(f) {
  var el = document.getElementById('hPrevia'); if (el) el.innerHTML = '<div class="vazio" style="margin-top:10px">A preparar o horário…</div>';
  ficheiroParaImagens(f).then(function (imgs) { folhaRecorte(imgs, 0, f.name); }, function (e) { if (el) el.innerHTML = '<div class="msg-erro" style="text-align:left">' + esc(e.message) + '</div>'; });
}
function folhaRecorte(imgs, pag, nome) {
  abrirFolha('<h2>Recortar o horário</h2><p>Arraste sobre a parte que quer mostrar às assistentes (por exemplo, só o horário delas). Se não recortar, fica a página inteira.</p>' +
    (imgs.length > 1 ? '<div class="vista-horas">' + imgs.map(function (x, i) { return '<button data-pg="' + i + '" class="' + (i === pag ? 'on' : '') + '">Página ' + (i + 1) + '</button>'; }).join('') + '</div>' : '') +
    '<div class="recorte" id="rcCaixa"><img id="rcImg" src="' + imgs[pag] + '" alt="" draggable="false"><div class="rc-sel" id="rcSel" hidden></div></div>' +
    '<div class="msg-erro" id="rcE"></div><div class="botoes-folha"><button class="btn sec" id="rcLimpar">Limpar recorte</button><button class="btn sec" id="rcTudo">Usar a página inteira</button><button class="btn verde" id="rcOk" disabled>Usar o recorte</button></div>');

  var ini = null, rect = null;
  var pos = function (e) { var r = img.getBoundingClientRect(); return { x: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), y: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) }; };
  var mostra = function () { if (!rect) { sel.hidden = true; ok.disabled = true; return; } sel.hidden = false; sel.style.left = rect.x * 100 + '%'; sel.style.top = rect.y * 100 + '%'; sel.style.width = rect.w * 100 + '%'; sel.style.height = rect.h * 100 + '%'; ok.disabled = rect.w < 0.03 || rect.h < 0.03; };
  caixa.addEventListener('pointerdown', function (e) { e.preventDefault(); caixa.setPointerCapture(e.pointerId); ini = pos(e); rect = { x: ini.x, y: ini.y, w: 0, h: 0 }; mostra(); });
  caixa.addEventListener('pointermove', function (e) { if (!ini) return; var p = pos(e); rect = { x: Math.min(ini.x, p.x), y: Math.min(ini.y, p.y), w: Math.abs(p.x - ini.x), h: Math.abs(p.y - ini.y) }; mostra(); });
  caixa.addEventListener('pointerup', function () { ini = null; if (rect && (rect.w < 0.03 || rect.h < 0.03)) rect = null; mostra(); });
  document.getElementById('rcLimpar').onclick = function () { rect = null; mostra(); };
  var gerar = function (r) {
    return new Promise(function (res) { var im = new Image(); im.onload = function () {
      var sx = Math.round((r ? r.x : 0) * im.naturalWidth), sy = Math.round((r ? r.y : 0) * im.naturalHeight), sw = Math.round((r ? r.w : 1) * im.naturalWidth), sh = Math.round((r ? r.h : 1) * im.naturalHeight);
      var k = Math.min(1, 2400 / sw), c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
      res({ nome: String(nome || 'horario').replace(/\.[^.]+$/, '') + (r ? ' (recorte)' : '') + '.jpg', mime: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.9) });
    }; im.src = imgs[pag]; });

  var concluir = function (app, envio, rotulo) {

    el.innerHTML = '<div class="hp-previa' + (app !== envio ? ' duas-prev' : '') + '">' + (app === envio ? fig(app, 'Na app e no envio às assistentes') : fig(app, 'Na app (horário da semana)') + fig(envio, 'No envio às assistentes')) +
      '<div class="linha-flex" style="justify-content:flex-start;margin-top:8px"><span class="tag e">' + esc(rotulo) + '</span><button class="btn sec peq" id="hRecortar">Recortar outra vez</button></div></div>';
    document.getElementById('hRecortar').onclick = function () { folhaRecorte(imgs, pag, nome); };

  var usar = function (r) {

      abrirFolha('<h2>Onde quer usar este recorte?</h2><div class="hp-previa"><img src="' + recorte.base64 + '" alt=""></div>' +
        '<div class="lista">' +
          '<button class="item opc" data-uso="ambos"><div><b>Nos dois</b><div class="meta">Aparece assim na app e é o que se envia às assistentes</div></div><span class="tag e">recomendado</span></button>' +
          '<button class="item opc" data-uso="app"><div><b>Só no horário da app</b><div class="meta">No WhatsApp envia-se a página inteira</div></div></button>' +
          '<button class="item opc" data-uso="envio"><div><b>Só para enviar às assistentes</b><div class="meta">Na app fica a página inteira</div></div></button>' +
        '</div><div class="botoes-folha"><button class="btn sec" id="usoV">Voltar ao recorte</button></div>');
      document.getElementById('usoV').onclick = function () { folhaRecorte(imgs, pag, nome); };
